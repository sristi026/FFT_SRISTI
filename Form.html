<html>
    <head>
        
        <title>Registration Form</title>
        <style>
            form{
                border: 2px solid black;
                width: 500px;
                padding: 20px;
                margin: auto;
            }
            label{
                padding-left: 100px;
            }
            h1{
                text-align: center;
            }
            #i1{
                width: 200px;
                height: 30px;
            }
            #i2{
                width: 200px;
                height: 30px;
                margin-left: 60px;
            }
            #i3{
                width: 200px;
                height: 30px;
                margin-left: 70px;
            }
            #i4{
                width: 200px;
                height: 30px;
                margin-left:33px;
            }
            #i5{
                width: 200px;
                margin-left: 44px;
            }
            #i6{
                width: 200px;
                height: 30px;
                margin-left:30px;
            }
            #i7{
                width: 200px;
                height: 30px;
                margin-left: 60px;
            }
            #i8{
                width: 200px;
                height: 30px;
                margin-left:62px;
            }
            #i9{
                margin:left-5px;
            }
            
            
            form{
                 background-color:rgb(132, 100, 150)
            }
            


            

        </style>
    </head>

    <body>
        

        <form >
            <h1>Registration Form</h1>
            <label >Registration Id :</label>
            <input id ="i1" type="number">
            <br> <br>

            <label>Name:</label>
            <input id="i2" type="text" name="Name">
            <br> <br>

            <label>Gender :</label>
            <br>

            <label>Male</label>
            <input type="radio" name="gender">

            <label>Female</label>
            <input type="radio" name="gender">
            <br> <br>

            <label>DOB</label>
            <input id="i3" type="date" name="DOB">
            <br> <br>

            <label>Phone no. :</label>
            <input id="i4" type="tel" name="Phone">
            <br> <br>

            <label>Address :</label>
            <textarea id="i5" name="Address"></textarea>
            <br> <br>

            <label>Department</label>
                <select id="i6">
                    <option></option>
                    <option>Applied Engineering</option>
                    <option>Management</option>
                    <option>Law</option>
                    <option>Engineering</option>
                </select>
                <br> <br>

                <label>Course</label>
                <select id="i7">
                    <option></option>
                    <option>BCA</option>
                    <option>MCA</option>
                    <option>MBA</option>
                    <option>LLB</option>
                    <option>LLM</option>
                    <option>CSE</option>
                </select>
                <br><br>

                <label>Email :</label>
                <input id="i8" type="email" name="email">
                <br><br>

                <label>Password</label>
                <input id="i9" type="password" name="password">
                <br><br>

                <label >Upload Resume</label>
                <input id="i10" type="file">
                <br><br>

                <button type="submit">Submit</button>
                <br><br>


                <button type="reset">Reset</button>


        </form>
        
    </body>

</html>
