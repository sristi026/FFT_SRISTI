<html>
    <head>
        <title>css Grid</title>
        <style>
            .sristi{
                display: grid;
                grid-template-columns: 100px 100px 100px;
                grid-template-rows: 100px 100px;
                gap: 10px;
            }
            div{
                background-color: rgb(222, 171, 33);
                text-align: center;
                line-height: 100px;
            }   
        </style>


    </head>
    <body>

    </body>

        </head>
        <body>
            <h1>css Grid</h1>
            <div class="sristi">    
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
        </body>
    </head>
</html>
